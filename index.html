<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Personnel</title>
  
  <link rel="stylesheet" href="css/general.css">
  <link rel="stylesheet" href="css/layout/grid.css">
  <link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/components/card.css">
</head>
<body>

  <div class="dashboard-container">
    
    <header class="main-header">
      <div class="header-left">
        <div class="header-badge"></div>
        <div class="header-title-group">
          <h1>DASHBOARD PERSONNEL</h1>
          <p>Bonjour Ethan 👋</p>
        </div>
      </div>
      <div class="header-right">
        <div class="clock-display" id="clock">--:--:--</div>
        <div class="date-display" id="date">Chargement...</div>
      </div>
    </header>

    <main class="dashboard-grid">
      <section class="card" id="weather-widget"></section>
      <section class="card" id="agenda-widget"></section>
      <section class="card" id="tasks-widget"></section>
      <section class="card" id="canadiens-widget"></section>
      <section class="card card-full-width" id="links-widget"></section>
    </main>

  </div>

  <!-- Entrée JavaScript principal -->
  <script type="module" src="js/app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
</body>
</html>
