<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Carte - Dashboard Personnel</title>
  
  <!-- 1. Les variables et le style global en premier -->
  <link rel="stylesheet" href="css/general.css">
  
  <!-- 2. Le style du composant Carte -->
  <link rel="stylesheet" href="css/components/card.css">
</head>
<body>

  <!-- Exemple d'utilisation du composant réutilisable .card -->
  <section class="card">
    
    <!-- En-tête de la carte -->
    <div class="card-header">
      <h2 class="card-title">MÉTÉO</h2>
      <span class="card-subtitle">Mis à jour 06:45</span>
    </div>

    <!-- Contenu principal de la carte -->
    <div class="card-content">
      <p>Ceci est le contenu de la carte. Tout composant placé ici bénéficiera automatiquement du fond sombre, des bordures et du padding de la carte.</p>
    </div>

  </section>

</body>
</html>
